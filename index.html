<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A visual graph theory view of Rubik's Cube solutions." />
    <title>Rubik's Cube Graph</title>
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <a class="title" href="https://github.com/umututku03/rubiks-graph">Rubik's Cube Graph</a>
        <div class="puzzle-switcher" role="group" aria-label="Cube size">
          <button class="puzzle-option active" data-puzzle="2x2x2" type="button">2×2</button>
          <button class="puzzle-option" data-puzzle="3x3x3" type="button">3×3</button>
        </div>
        <div class="status"><span></span><span id="status-text">Ready</span></div>
      </header>

      <section class="visualization" aria-label="Cube and graph visualization">
        <div class="cube-view">
          <div class="view-label"><span id="cube-title">2×2 cube</span><span><strong id="current-move">0</strong> / <span id="total-moves">0</span></span></div>
          <div id="cube-stage"></div>
        </div>
        <div class="graph-view">
          <canvas id="graph-canvas"></canvas>
          <span class="depth-label">move <strong id="graph-depth">0</strong></span>
        </div>
      </section>

      <section class="controls">
        <div class="scramble-row">
          <label for="scramble-input">Scramble</label>
          <input id="scramble-input" value="R U R' F2 U' R2" autocomplete="off" spellcheck="false" />
          <button id="random-button" type="button">Random</button>
          <button id="solve-button" type="button">Solve</button>
        </div>

        <div class="playback">
          <button id="reset-button" type="button" aria-label="Return to scrambled state">Reset</button>
          <button id="previous-button" type="button" aria-label="Previous move">Previous</button>
          <button class="play-button" id="play-button" type="button">Play</button>
          <button id="next-button" type="button" aria-label="Next move">Next</button>
          <input id="timeline" type="range" min="0" max="0" value="0" aria-label="Solution progress" />
        </div>

        <p id="input-message">Standard face-turn notation, up to 19 moves.</p>
        <div class="moves" id="solution-moves"><span class="empty-move">The solution will appear here.</span></div>
      </section>

      <section class="facts" aria-label="Cube graph facts">
        <span><b id="state-count">3,674,160</b> states</span>
        <span><b>18</b> edges per state</span>
        <span><b id="gods-number">11</b> maximum optimal distance</span>
        <span><b id="path-length">—</b> <i id="path-caption">moves in this path</i></span>
      </section>
    </main>
    <script type="module" src="/web/main.js"></script>
  </body>
</html>
